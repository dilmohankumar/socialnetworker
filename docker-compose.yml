# Production stack:  docker compose up -d --build
# Secrets live in server/.env (not in git). SITE_ADDRESS can be overridden via environment.
services:
  api:
    build: ./server
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    restart: unless-stopped
    mem_limit: 300m
    # only reachable from the web container, not from the internet
    expose:
      - "5000"

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-socialnetworker.in, www.socialnetworker.in}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - caddy_data:/data      # certificates live here: keep this volume
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

# /etc/nginx/sites-available/socialnetworker
# Rate limits (http-context directives are fine here: sites-enabled is included inside http{}).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_forms:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name socialnetworker.in www.socialnetworker.in;

    root /var/www/socialnetworker;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers (certbot copies this server block for :443, so they apply to HTTPS too)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Lead form: strict limit to stop spam / mail-quota abuse
    location = /api/contact {
        limit_req zone=api_forms burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rest of the API -> Node app (PM2) on localhost:5000
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built assets are fingerprinted: cache hard. config.js must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Never serve dotfiles (.env, .git, .htaccess ...), except Let's Encrypt's .well-known
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Single-page app: unknown paths -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 1m;
}
